name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests scripts

      - name: Check formatting with black
        run: black --check src tests scripts

      - name: Run tests with coverage
        run: pytest --cov=or_utilization --cov-report=term-missing

      - name: Generate sample data and smoke-test CLI
        run: |
          python scripts/generate_sample_data.py --out data/sample_schedule.csv --days 10 --rooms 2
          or-util analyze --input data/sample_schedule.csv --output-dir /tmp/report_smoke_test
          or-util simulate --input data/sample_schedule.csv --output-dir /tmp/report_smoke_test
